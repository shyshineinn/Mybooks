name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            for apk in app/build/outputs/apk/release/*.apk; do
              "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
                --ks keystore.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$KEYSTORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "${apk%.apk}-signed.apk" "$apk"
            done
          else
            keytool -genkeypair -v -keystore test.jks -storepass android -alias android \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mybooks Test"
            for apk in app/build/outputs/apk/release/*.apk; do
              "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign \
                --ks test.jks \
                --ks-key-alias android \
                --ks-pass pass:android \
                --key-pass pass:android \
                --out "${apk%.apk}-test-signed.apk" "$apk"
            done
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mybooks-release-apk
          path: |
            app/build/outputs/apk/release/*-signed.apk
            app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*-signed.apk \
            --title "Mybooks $GITHUB_REF_NAME" \
            --generate-notes
