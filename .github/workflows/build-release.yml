name: Build Release APK

# 本地构建步骤见 devdocs/mybooks-open-source.md；
# 此工作流仅保留为手动备用（不会因推 tag 自动触发）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK components
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            KS_ARGS="--ks keystore.jks --ks-key-alias $KEY_ALIAS --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD"
          else
            keytool -genkeypair -v -keystore test.jks -storepass android -alias android \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mybooks Test"
            KS_ARGS="--ks test.jks --ks-key-alias android --ks-pass pass:android --key-pass pass:android"
          fi
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *arm64-v8a*)   name=Mybooks-arm64-v8a.apk ;;
              *armeabi-v7a*) name=Mybooks-armeabi-v7a.apk ;;
              *x86_64*)      name=Mybooks-x86_64.apk ;;
              *x86*)         name=Mybooks-x86.apk ;;
              *universal*)   name=Mybooks-universal.apk ;;
              *)             continue ;;
            esac
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign $KS_ARGS \
              --out "dist/$name" "$apk"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mybooks-release-apk
          path: dist/*.apk
