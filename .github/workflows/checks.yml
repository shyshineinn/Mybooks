name: Fork source and sync checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-public.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
      - run: chmod +x gradlew
      - name: Targeted sync and migration tests; build debug and instrumentation APKs
        run: ./gradlew --no-daemon -PabiFilter=arm64-v8a testDebugUnitTest --tests 'com.huangder.lumibooks.data.sync.MyBooks*' --tests 'com.huangder.lumibooks.data.local.database.*' assembleDebug assembleDebugAndroidTest
